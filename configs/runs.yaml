# Frozen experiment grid — decided at the Phase 1 go/no-go (Sun 18 Oct 2026).
# Do not change after Phase 2 starts. Any deviation is logged in the README.
# Evidence for every choice: results/pilot_sweep.csv and the plan's Phase 1 notes.

dataset:
  repo_id: lerobot/libero
  revision: a1aaacb7f6cd6ee5fb43120f673cebb0cfea7dd4   # pinned
  splits: configs/splits.json                          # nested 5/10/20/all, seed 0

lerobot_version: "0.6.2"
suite: libero_object
tasks: {t1: 3, t2: 6, t3: 8}     # label -> simulator task id (--env.task_ids)
demo_sizes: ["5", "10", "20", "all"]
training_seed: 1000                # seed 1 (original grid, run names without suffix)
# Second training seed added 20 Oct, after the seed-1 results (SmolVLA per-task curves were
# non-monotonic; 1 seed cannot separate data effects from training-run randomness). Applied to
# every run of both methods, same settings otherwise; logged as a deviation in the README.
# Third training seed added 22 Oct, ACT only (largest seed-to-seed variance, up to 45 points;
# SmolVLA's 2 seeds agree within 11 points and the cloud budget is spent). Decided before any
# seed-3 result: included in ACT's per-seed points and mean whatever it shows.
training_seeds: {1: 1000, 2: 2000, 3: 3000}  # seed index -> --seed; index > 1 adds "_s<index>" to run names
# Same number of training steps for every demo size (fixed-steps rule).

evaluation:                       # identical for both methods (fairness rules 3, 7, 8)
  where: laptop (WSL2, MuJoCo EGL -> kms_swrast CPU renderer)
  episodes_per_checkpoint: 50     # LIBERO fixed initial states 0..49
  checkpoints_averaged: 3         # option B: score = mean over the last 3 checkpoints (150 episodes)
  fixed_args:
    - --env.type=libero
    - --env.task=libero_object
    - --env.init_states=true      # hard reset = LeRobot default
    - --env.observation_height=256
    - --env.observation_width=256
    - --eval.batch_size=1
    - --seed=1000
  n_action_steps: 10              # both methods re-plan every 10 actions

methods:
  act:
    train_where: laptop (RTX 4050 6 GB)
    from: scratch (ImageNet ResNet-18 backbone, LeRobot default)
    train_args:
      - --policy.type=act
      - --policy.device=cuda
      - --policy.push_to_hub=false
      - --batch_size=8
      - --steps=10000
      - --save_freq=2000
      - --num_workers=4
      - --wandb.disable_artifact=true   # added 21 Oct: logging only (no checkpoint upload to wandb; slow mobile uplink stalled runs at exit)
    eval_checkpoints: ["006000", "008000", "010000"]
    eval_args:
      - --policy.n_action_steps=10
    pilot: {steps_per_s: 5.9, min_per_run: 30, eval_min_per_50eps: 13}

  smolvla:
    train_where: HF Jobs l4x1 (L4 24 GB, $0.80/h)
    from: lerobot/smolvla_base (train_expert_only, frozen VLM)
    train_args:
      - --policy.path=lerobot/smolvla_base
      - --policy.train_expert_only=true   # explicit (18 Oct): same as pilot and LeRobot default; ~100M of 450M trainable
      - --policy.private=true
      - --batch_size=32
      - --steps=5000
      - --save_freq=1000
      - --save_checkpoint_to_hub=true
      - --num_workers=6
      - --job.target=l4x1
      - --job.timeout=3h
      - --job.detach=true          # submit and return; jobs run in parallel in the cloud
      - '--rename_map={"observation.images.image": "observation.images.camera1", "observation.images.image2": "observation.images.camera2"}'
    eval_checkpoints: ["003000", "004000", "005000"]
    eval_args:
      - --policy.n_action_steps=10
      - '--rename_map={"observation.images.image": "observation.images.camera1", "observation.images.image2": "observation.images.camera2"}'
    pilot: {steps_per_s: 1.07, est_usd_per_run: 1.2, eval_min_per_50eps: 19}

runs:
  naming: "<method>_obj_<task label>_n<size>"   # e.g. act_obj_t1_n05, smolvla_obj_t3_nall
  count: 24                                      # 2 methods x 3 tasks x 4 sizes
  # estimates: ACT train 12 x 30 min = 6 h (laptop); SmolVLA 12 x ~$1.2 = ~$14 (HF Jobs)
  # evaluation (option B): ACT ~8-11 h, SmolVLA ~11-14 h, all on the laptop
